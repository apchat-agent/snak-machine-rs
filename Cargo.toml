[package]
name = "snac-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apchat-agent/snak-machine-rs"
description = "Userspace IPv6 stub-router prototype for draft-ietf-snac-simple-12"

[[test]]
name = "wire"
path = "tests/wire.rs"

[dependencies]
libc = "=0.2.177"
getrandom = "=0.3.4"
libloading = { version = "=0.8.9", optional = true }

smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["std", "tls12", "zeroize"] }
p256 = { version = "=0.13.2", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["std", "builder"] }
p384 = { version = "=0.13.1", default-features = false, features = ["std", "ecdsa"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
ed448-goldilocks-plus = { version = "=0.16.0", default-features = false, features = ["std", "signing", "pkcs8"] }
sha1 = { version = "=0.10.7", default-features = false, features = ["std"] }

[features]
default = []
pcap = ["dep:libloading"]

[[bin]]
name = "snac-router"
path = "src/main.rs"
