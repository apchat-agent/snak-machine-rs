[package]
name = "snac-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apchat-agent/snak-machine-rs"
description = "Userspace IPv6 stub-router prototype for draft-ietf-snac-simple-12"

[[test]]
name = "wire"
path = "tests/wire.rs"

[dependencies]
libc = "=0.2.177"
getrandom = "=0.3.4"
libloading = { version = "=0.8.9", optional = true }

[features]
default = []
pcap = ["dep:libloading"]

[[bin]]
name = "snac-router"
path = "src/main.rs"
